{% extends "base.html" %}

{% block title %}Reset Password | CreativeConnect{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3">Forgotten your password?</h1>
                    <p class="text-muted">
                        Enter your email address and we'll send you a reset link.
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}

                        <button class="btn btn-primary w-100" type="submit">
                            Send reset link
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
